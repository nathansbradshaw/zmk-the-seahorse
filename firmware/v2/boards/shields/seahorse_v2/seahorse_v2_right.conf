# Prefer more frequent idle listening by the battery-powered left half.
# Interval remains 7.5 ms and supervision timeout remains 4 s. Latency 4 allows
# up to four skipped events (37.5 ms idle spacing) rather than thirty (232.5 ms).
# This increases idle power consumption; measure left-half battery runtime.
CONFIG_ZMK_SPLIT_BLE_PREF_LATENCY=4
CONFIG_ZMK_SPLIT_BLE_CENTRAL_POSITION_QUEUE_SIZE=64

# The existing nice!view gem custom status screen is built on the right only.
CONFIG_ZMK_DISPLAY_STATUS_SCREEN_CUSTOM=y
