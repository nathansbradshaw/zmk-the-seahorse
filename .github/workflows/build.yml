name: Build ZMK firmware
on:
  push:
    paths:
      - '.github/workflows/build.yml'
      - 'firmware/v2/**'
      - 'config'
      - 'build.yaml'
      - 'zephyr/**'
  pull_request:
    paths:
      - '.github/workflows/build.yml'
      - 'firmware/v2/**'
      - 'config'
      - 'build.yaml'
      - 'zephyr/**'
  workflow_dispatch:

jobs:
  build:
    # ZMK v0.3 uses the Zephyr 3.5 board model (nice_nano_v2).
    uses: zmkfirmware/zmk/.github/workflows/build-user-config.yml@c25e927a2fae915e208a8777ce211a10c658e771
