name: Build ZMK firmware
on:
  push:
    paths:
      - '.github/workflows/build.yml'
      - '.github/workflows/build-user-config.yml'
      - 'firmware/v2/**'
      - 'config'
      - 'build.yaml'
      - 'zephyr/**'
  pull_request:
    paths:
      - '.github/workflows/build.yml'
      - '.github/workflows/build-user-config.yml'
      - 'firmware/v2/**'
      - 'config'
      - 'build.yaml'
      - 'zephyr/**'
  workflow_dispatch:

jobs:
  display-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify animation codec and USB playback sessions
        working-directory: firmware/v2
        shell: bash
        run: |
          set -euo pipefail
          cmp ../../.github/workflows/build-user-config.yml .github/workflows/build-user-config.yml
          task_tmp=$(mktemp -d)
          trap 'rm -rf "$task_tmp"' EXIT
          rustc --edition=2021 --test boards/shields/nice_view_gem/widgets/bad_apple_core.rs -o "$task_tmp/player-tests"
          "$task_tmp/player-tests"
          rustc --edition=2021 --test tools/pack_bad_apple.rs -o "$task_tmp/pack-tests"
          "$task_tmp/pack-tests"
  build:
    # Pinned ZMK v0.3 recipe, with the Rust display toolchain installed.
    uses: ./.github/workflows/build-user-config.yml
