# The plugged-in right half is the central. Keep the existing 7.5 ms interval
# and 4 s supervision timeout, but allow only four skipped connection events
# instead of thirty: at most 37.5 ms between idle listening events, rather than
# 232.5 ms. This increases left-half idle power consumption; battery life must
# be measured on hardware.
CONFIG_ZMK_SPLIT_BLE_PREF_LATENCY=4

# Leave room for a full burst of left-half key transitions (default: 5).
CONFIG_ZMK_SPLIT_BLE_CENTRAL_POSITION_QUEUE_SIZE=64
