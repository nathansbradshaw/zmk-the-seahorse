#
# Seahorse Settings
#

# Uncomment the following line to enable the Seahorse OLED Display
# CONFIG_ZMK_DISPLAY=y


#
# Logging
#

CONFIG_ZMK_USB_LOGGING=n
CONFIG_ZMK_LOGGING_MINIMAL=n
CONFIG_PS2_LOG_LEVEL_DBG=n
CONFIG_UART_LOG_LEVEL_DBG=n
CONFIG_LOG_MODE_IMMEDIATE=n
CONFIG_ZMK_POINTING=y

# This setting is important to get the full log instead of
# one where the initial parts are cut out
CONFIG_LOG_PROCESS_THREAD_STARTUP_DELAY_MS=3000

# Increase BT power
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y

# Turn on mouse key
CONFIG_ZMK_MOUSE=y
CONFIG_INPUT=y
CONFIG_GPIO=y

# Endable ps2 trackpoint module
# CONFIG_ZMK_INPUT_MOUSE_PS2_REPORT_INTERVAL_MIN=12

# Go to sleep after 60 mins (5*60*1000ms)
# CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=3600000
CONFIG_ZMK_SLEEP=y
